url: https://github.com/Setsuna-Kitahara/dsh-session-lock
name: Setsuna-Kitahara/dsh-session-lock
category: session
description:
  en: 'A lock button on every sidebar session row: a locked session is refused by every archive path, including the ⋮ menu, other plugins and scripts calling workspaces.archiveSession, with the lock list persisted on the host and a host route that bulk-archives inactive sessions while always skipping locked ones.'
  zh: '侧栏每个会话行上的锁按钮：锁定的会话会被所有归档路径拒绝，包括 ⋮ 菜单、其它插件与脚本调用的 workspaces.archiveSession；锁清单持久化在宿主侧，另有批量归档不活跃会话的宿主路由，永远跳过已锁定的会话。'
